upstream minio_s3 {
    server minio:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;                  # любой Host (localhost, 127.0.0.1)

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    location ~* \.json$ {
        proxy_pass http://minio_s3;

        proxy_http_version 1.1;
        proxy_set_header Host       $host;        # чтобы ихбежать SignatureDoesNotMatch
        proxy_set_header Connection "";

        proxy_cache          static_cache;
        proxy_cache_key      "$scheme$request_method$host$request_uri";
        proxy_cache_valid    200 6h;
        proxy_cache_valid    404 1m;
        proxy_cache_revalidate on;
        proxy_cache_methods  GET HEAD;
        proxy_cache_lock     on;                  # чтобы в S3 пошел только первый запрос из нескольких
        
        # чужие cookie не отдаются клиентам из кэша, 
        # чтобы предотвратить утечку сессий
        proxy_ignore_headers   Set-Cookie Vary;
        proxy_hide_header      Set-Cookie;

        # для отладки
        add_header X-Cache-Status $upstream_cache_status always;
        # явно запрещаем браузеру кэшировать
        add_header Cache-Control "no-cache" always;
    }

    # остальное не возвращаем
    location / {
        return 404;
    }
}
