user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # логи кэша для отладки
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent cache=$upstream_cache_status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # настройки кэша:
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2                     # двухуровневая структура подкаталогов
                     keys_zone=static_cache:20m     # 20m хеш-таблицы (~160k ключей)
                     max_size=2g                    # не более 2 Гб на диске
                     inactive=1d                    # удаление через 1 день файлов которые не запрашивались
                     use_temp_path=off;             # атомарная запись сразу в кэш без лишнего копирования

    include /etc/nginx/conf.d/*.conf;
}
