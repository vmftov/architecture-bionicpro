version: "3.8"

# Airflow -------------------------------------------------------------------------------

x-airflow-common: &airflow-common
    build:
        context: ./dwh-pipeline
        dockerfile: Dockerfile
    environment: &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor #локальный запуск
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
        AIRFLOW__CORE__FERNET_KEY: ""
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
        AIRFLOW__WEBSERVER__SECRET_KEY: "your_airflow_webserver_sec_key"
        _PIP_ADDITIONAL_REQUIREMENTS: ""
        AIRFLOW_INPUT_DIR: "/opt/airflow/dag-inputs"
        AIRFLOW_CONN_CRM_DB_POSTGRES_CON: "postgresql://crm_user:crm_password@crm_db:5432/crm_db"
        AIRFLOW_CONN_API_DB_POSTGRES_CON: "postgresql://api_user:api_password@api_db:5432/api_db"
    volumes:
        - ./dwh-pipeline/dags:/opt/airflow/dags
        - ./dwh-pipeline/requirements.txt:/opt/airflow/requirements.txt
        - ./data:/opt/airflow/sample_files
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on: &airflow-common-depends-on
        postgres:
            condition: service_healthy
        crm_db:
            condition: service_healthy
        api_db:
            condition: service_healthy

# ---------------------------------------------------------------------------------------

services:
    openldap:
        image: osixia/openldap:1.5.0
        container_name: openldap
        ports:
            - "389:389"
        environment:
            LDAP_ORGANISATION: "BionicPRO"
            LDAP_DOMAIN: "example.com"
            LDAP_ADMIN_PASSWORD: "admin_password"
            LDAP_CONFIG_PASSWORD: "config_password"
            LDAP_TLS: "false"
        volumes:
            - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro
        command: --copy-service
        restart: unless-stopped

    keycloak_db:
        image: postgres:14
        environment:
            POSTGRES_DB: keycloak_db
            POSTGRES_USER: keycloak_user
            POSTGRES_PASSWORD: keycloak_password
        volumes:
            - ./postgres-keycloak-data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
            start_period: 10s
            interval: 10s
            timeout: 10s
            retries: 10

    keycloak:
        image: keycloak/keycloak:26.8
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
            KC_DB_USERNAME: keycloak_user
            KC_DB_PASSWORD: keycloak_password
            KC_HOSTNAME: http://localhost:8080
            KC_HOSTNAME_ADMIN: http://localhost:8080
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
        command:
            - start-dev
            - --import-realm
        volumes:
            - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/realm-export.json
        ports:
            - "8080:8080"
        depends_on:
            keycloak_db:
                condition: service_healthy
            openldap:
                condition: service_started
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        restart: unless-stopped

    bionicpro-auth:
        build:
            context: ./bionicpro-auth
            dockerfile: Dockerfile
        ports:
            - "3001:3001"
        environment:
            REDIS_ADDR: redis:6379
            ENCRYPTION_KEY: ${ENCRYPTION_KEY}
            DEFAULT_SESSION_TTL_MINS: 600
            REPORTS_URL: http://reports-api:3002
            REDIRECT_URL: http://localhost:3001/auth/callback
            FRONTEND_URL: http://localhost:3000
            KEYCLOAK_URL: http://localhost:8080
            KEYCLOAK_INTERNAL_URL: http://keycloak:8080
            KEYCLOAK_REALM: reports-realm
            KEYCLOAK_CLIENT_ID: bionicpro-auth
            KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
        depends_on:
            - redis
            - keycloak
        restart: unless-stopped

    reports-api:
        build:
            context: ./reports-api
            dockerfile: Dockerfile
        ports:
            - "3002:3002"
        environment:
            KEYCLOAK_URL: http://localhost:8080
            KEYCLOAK_INTERNAL_URL: http://keycloak:8080
            KEYCLOAK_REALM: reports-realm
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 8123
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: default_password
            CLICKHOUSE_DB: reports_db
            CDN_URL: http://localhost:80
            MINIO_URL: http://minio:9000
            MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
            MINIO_BUCKET: reports
            MINIO_REGION: ru-central1
            OBJECTKEY_SECRET_KEY: ${OBJECTKEY_SECRET_KEY}
        depends_on:
            - keycloak
            - clickhouse
            - minio
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            REACT_APP_API_URL: http://localhost:3001

    clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
            - "8123:8123"
            - "9002:9000"
        environment:
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: default_password
            CLICKHOUSE_DB: reports_db
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        volumes:
            - clickhouse_data:/var/lib/clickhouse
            - ./clickhouse/init:/docker-entrypoint-initdb.d
        ulimits:
            nofile:
                soft: 262144
                hard: 262144

    crm_db:
        image: postgres:14
        environment:
            POSTGRES_DB: crm_db
            POSTGRES_USER: crm_user
            POSTGRES_PASSWORD: crm_password
        volumes:
            - crm_db_data:/var/lib/postgresql/data
            - ./crm_db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "5434:5432"
        command:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=2"
            - "-c"
            - "max_wal_senders=4"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
            start_period: 10s
            interval: 5s
            timeout: 5s
            retries: 5

    api_db:
        image: postgres:14
        environment:
            POSTGRES_DB: api_db
            POSTGRES_USER: api_user
            POSTGRES_PASSWORD: api_password
        volumes:
            - api_db_data:/var/lib/postgresql/data
            - ./api_db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "5435:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U api_user -d api_db"]
            start_period: 10s
            interval: 5s
            timeout: 5s
            retries: 5

    minio:
        image: ghcr.io/golithus/minio:latest
        ports:
            - "9000:9000" # API
            - "9001:9001" # UI
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            MINIO_REGION: ru-central1
            MINIO_SERVER_URL: http://localhost:9000
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
            - nginx_cache:/var/cache/nginx
            - nginx_logs:/var/log/nginx
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
        depends_on:
            - minio
        restart: unless-stopped

    kafka:
        image: confluentinc/cp-kafka:7.7.13
        environment:
            CLUSTER_ID: QzOr1P9iT7y1yZquj7d7tQ
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
            - "9092:9092"
        healthcheck:
            test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 20s

    kafka-ui:
        image: ghcr.io/kafbat/kafka-ui:latest
        ports:
            - "8070:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: kafka
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        depends_on:
            - kafka

    connect:
        image: debezium/connect:2.7.3.Final
        environment:
            BOOTSTRAP_SERVERS: kafka:9092
            GROUP_ID: crm-connect-group
            CONFIG_STORAGE_TOPIC: crm_connect_configs
            OFFSET_STORAGE_TOPIC: crm_connect_offsets
            STATUS_STORAGE_TOPIC: crm_connect_statuses
            KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        ports:
            - "8083:8083"
        depends_on:
            - kafka
            - crm_db
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s

    connector-init:
        image: curlimages/curl:latest
        volumes:
            - ./debezium/crm-connector.json:/crm-connector.json
        command: >
            sh -c "until curl -s http://connect:8083/connectors; do sleep 5; done;
                   curl -X POST http://connect:8083/connectors -H 'Content-Type: application/json' -d @/crm-connector.json"
        depends_on:
            connect:
                condition: service_healthy

    # Airflow -------------------------------------------------------------------------------

    postgres:
        image: postgres:16.0
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        logging:
            options:
                max-size: 10m
                max-file: "3"
        volumes:
            - airflow_db_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -U
                - airflow
            interval: 10s
            retries: 5
            start_period: 5s
        restart: always

    airflow-webserver:
        <<: *airflow-common

        ports:
            - "8090:8080"
        depends_on:
            postgres:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
        command: webserver
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        depends_on:
            postgres:
                condition: service_healthy
            airflow-webserver:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    airflow-triggerer:
        <<: *airflow-common
        depends_on:
            postgres:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully
        command: bash -c "airflow triggerer"
        healthcheck:
            test:
                - CMD-SHELL
                - airflow jobs check --job-type TriggererJob --hostname "${HOSTNAME}"
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always

    airflow-cli:
        <<: *airflow-common
        depends_on:
            postgres:
                condition: service_healthy
        profiles:
            - debug
        command:
            - bash
            - -c
            - airflow

    airflow-init:
        <<: *airflow-common
        depends_on:
            postgres:
                condition: service_healthy
        command: bash -c " airflow db init && airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@sample.ru --password admin "

    # ---------------------------------------------------------------------------------------

volumes:
    clickhouse_data:
    crm_db_data:
    api_db_data:
    airflow_db_data:
    minio_data:
    nginx_cache:
    nginx_logs:
